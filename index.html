<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ジオラマアイランド Diorama Island</title>
<meta name="description" content="中身は3D、見た目はドット絵。空に浮かぶ島の街づくりタイクーン。 / A pixel-art 3D floating-island town builder.">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icon-house-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/icon-house-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-house-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icon-house-180.png">
<meta property="og:title" content="ジオラマアイランド Diorama Island">
<meta property="og:description" content="中身は3D、見た目はドット絵。空に浮かぶ島の街づくりタイクーン。">
<meta property="og:image" content="assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{ --ink:#1b1f3a; --ink2:#2a3160; --paper:#f6ecc9; --hi:#ffd35a; --ok:#7ee08a; --ng:#ff6b6b; --sub:#a9b3e6; --ui:1; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;color:var(--paper);
  font-family:'DotGothic16',monospace;font-size:15px;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated}
button{font:inherit;color:inherit;cursor:pointer}
.px{background:var(--ink);border:3px solid var(--paper);box-shadow:0 0 0 3px var(--ink),5px 5px 0 3px rgba(0,0,0,.45)}
.btn{white-space:nowrap;background:var(--ink2);border:2px solid var(--paper);padding:5px 10px;line-height:1.2;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.btn:hover:not([disabled]){background:#3c4690}
.btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.5)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:#5a3c10;border-color:var(--hi);color:var(--hi)}
.btn.hot{background:#2f6a3a}
/* 建物の看板はUIより下に描く */
#badges,#pops{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.badge{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:#1b1f3a;border:2px solid #f6ecc9;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;box-shadow:2px 2px 0 rgba(0,0,0,.45);font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.badge.small{width:20px;height:20px;font-size:11px;opacity:.85}
.badge.warn{border-color:#ff6b6b;animation:bw .5s steps(2) infinite}
.badge.build{border-color:var(--hi)}
@keyframes bw{50%{border-color:#ffd35a}}
.pop{position:absolute;font-size:16px;color:#fff;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;white-space:nowrap;transform:translate(-50%,-50%)}
.pop.g{color:var(--hi);font-size:18px}
#ui{position:fixed;inset:0;pointer-events:none;zoom:var(--ui)}
#ui > *{pointer-events:auto}
#top{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#top > *{pointer-events:auto}
.chip{background:var(--ink);border:2px solid var(--paper);padding:3px 8px;box-shadow:3px 3px 0 rgba(0,0,0,.5);white-space:nowrap}
.chip b{color:var(--hi);font-weight:normal}
.chip.item{cursor:pointer}
.chip.item:hover{background:#3c4690}
.chip small{color:var(--sub)}
#goldChip{font-size:18px;min-width:7.4em;text-align:right}
/* 桁が増えても、うしろのボタンの位置が変わらないように幅を固定 */
#top,#ui .btn,.chip{font-variant-numeric:tabular-nums}
#clock{min-width:9.4em} #moodChip{min-width:5.6em} #nsBtn{min-width:6.6em} #spdBtn{min-width:4.4em}
.chip.item b{display:inline-block;min-width:3.4ch;text-align:right} .chip.item small{display:inline-block;min-width:5.5ch}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.bgrid .btn{width:100%;padding:6px 4px;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.row .btn.w{min-width:8.6em}
.seeds{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.seed .c{color:var(--paper)}
#goldChip b{color:var(--paper)}
.gu{font-style:normal;color:var(--hi);margin-left:.22em}
#missions{position:absolute;left:8px;top:52px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none;max-width:calc(100% - 280px)}
.mis{background:rgba(27,31,58,.92);border:2px solid var(--hi);padding:3px 8px;font-size:12px;min-width:170px;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.mis .bars{display:flex;flex-direction:column;gap:2px;margin-top:2px}
.mbar{height:6px;background:#0b0f26;border:1px solid var(--paper);position:relative}
.mbar i{display:block;height:100%;background:var(--ok)}
.mbar.t i{background:var(--hi)}
.mbar.t.late i{background:var(--ng)}
#side{position:absolute;right:8px;top:52px;width:250px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#side > *{pointer-events:auto}
.card{padding:8px 10px}
.card h4{margin:0 0 4px;font-weight:normal;color:var(--hi);font-size:14px}
.bar{height:8px;background:#0b0f26;border:1px solid var(--paper);margin-top:4px}
.bar i{display:block;height:100%;background:var(--hi)}
#tut{border-color:var(--hi)}
#tut .msg{line-height:1.5}
#tut .skip{margin-top:6px;font-size:12px;padding:2px 8px}
#bottom{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px}
#bottom .btn{font-size:16px;padding:8px 14px}
#rot{position:absolute;right:10px;bottom:62px;display:none;gap:6px}
#rot .btn{font-size:20px;padding:6px 12px}
#confirm{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);display:none;gap:8px;padding:6px 10px;align-items:center}
#confirm .btn{font-size:16px;padding:8px 14px}
#confirmTxt{white-space:nowrap}
.scroll{touch-action:pan-y;-webkit-overflow-scrolling:touch}
#panel{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));max-height:50vh;overflow:auto;padding:10px}
#bpanel{position:absolute;left:8px;top:96px;width:min(300px,calc(100vw - 32px));padding:10px;max-height:calc(100vh - 180px);overflow:auto}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--hi)}
.ph .x{padding:0 8px}
.tabs{display:flex;gap:4px;margin-bottom:6px}
.tabs .btn{flex:1;padding:6px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.opt{text-align:left;padding:6px 8px;background:var(--ink2);border:2px solid var(--paper);box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.opt:hover:not([disabled]){background:#3c4690}
.opt[disabled]{opacity:.45}
.opt .n{color:var(--hi)}
.opt .c{font-size:13px}
.opt .d{font-size:12px;color:var(--sub);line-height:1.35;margin-top:2px}
.row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed #4a5290;flex-wrap:wrap}
.row .grow{flex:1;min-width:120px}
.kv{font-size:13px;line-height:1.55}
.kv .g,.g{color:var(--ok)} .kv .r,.r{color:var(--ng)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg .btn{padding:4px 8px;font-size:13px}
.swatch{display:inline-block;width:14px;height:14px;border:2px solid var(--paper);vertical-align:middle}
#tip{position:absolute;padding:6px 8px;font-size:13px;line-height:1.45;pointer-events:none;max-width:260px;display:none}
#shareBtn,#scoreBtn{min-width:4.6em}
.rankimg{display:block;width:100%;aspect-ratio:16/9;max-height:36vh;object-fit:contain;image-rendering:pixelated;margin:8px 0 4px}
.scorehead{display:flex;align-items:center;gap:12px;margin:4px 0 6px;line-height:1.35}
.scorehead b{font-size:24px;color:var(--hi);font-weight:normal}
.rk{flex:none;font-size:44px;line-height:56px;width:58px;text-align:center;border:3px solid currentColor}
.rkS{color:#ffe070;background:#4a2a70}.rkA{color:#ffc860;background:#6a3a30}.rkB{color:#d0e4f4;background:#28508a}.rkC{color:#e0a070;background:#4a3428}.rkD{color:#a8b0c0;background:#303644}
.srow{display:flex;align-items:center;gap:8px;font-size:13px;line-height:1.7}
.srow span{width:9.5em;white-space:nowrap}.srow .bar{flex:1;margin:0}.srow em{font-style:normal;width:3.6em;text-align:right;color:var(--hi)}
#nameIn,#modal .mbox input{display:block;width:100%;font:inherit;color:var(--paper);background:#0b0f26;border:2px solid var(--paper);padding:6px 8px;margin-top:3px;-webkit-user-select:text;user-select:text;touch-action:manipulation}
.ship{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px;padding:3px 0;border-bottom:1px dashed #4a5290}
.ship b{color:var(--paper);font-weight:normal}.ship span{color:var(--sub);font-size:13px}
.shareimg{display:block;width:100%;aspect-ratio:16/9;background:#0b0f26;margin-top:8px}
#visit{position:absolute;left:8px;top:8px;max-width:calc(100% - 16px);padding:6px 10px;display:flex;gap:14px;align-items:center;line-height:1.4}
#visit b{color:var(--hi);font-weight:normal}
body.visiting #top,body.visiting #side,body.visiting #bottom,body.visiting #bellBtn,body.visiting #missions{display:none!important}
#bellBtn{position:absolute;left:8px;bottom:62px;font-size:16px;padding:8px 14px}
#bellBtn:not([hidden]) ~ #toasts{bottom:112px}
body.tooling #confirm [data-act="confirmYes"]{display:none}
#toasts{position:absolute;left:8px;bottom:62px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:min(360px,calc(100vw - 32px))}
.toast{background:rgba(27,31,58,.92);border:2px solid var(--paper);padding:4px 8px;font-size:13px;animation:tin .15s steps(3)}
.toast.good{border-color:var(--ok)} .toast.bad{border-color:var(--ng)} .toast.ev{border-color:var(--hi)}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
#modal{position:absolute;inset:0;background:rgba(5,8,25,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .mbox{width:min(520px,100%);padding:14px 16px;max-height:90vh;overflow:auto}
#modal h2{margin:0 0 6px;font-weight:normal;color:var(--hi);font-size:20px}
#modal p{line-height:1.6;margin:6px 0}
#modal .opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#modal .opt{width:100%}
#modal .day{font-size:12px;color:var(--sub)}
#modal .evimg{display:block;width:100%;max-height:34vh;object-fit:cover;border:2px solid var(--paper);margin:6px 0 8px;image-rendering:pixelated}
.title-big{font-size:28px;color:var(--hi);text-align:center;margin:8px 0}
.pulse{animation:pulse .6s steps(2) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--hi),3px 3px 0 rgba(0,0,0,.5)}}
[hidden]{display:none!important}
@media (max-width:700px){
  html,body{font-size:13px}
  #side{top:auto;bottom:62px;width:200px}
  #toasts,#bellBtn:not([hidden]) ~ #toasts{bottom:auto;top:130px}
  #bellBtn{font-size:13px}
  body.placing #bellBtn, body.panel-open #bellBtn{display:none}
  body.bpanel-open #bellBtn, body.bpanel-open #side{display:none}
  #bottom .btn{font-size:13px;padding:7px 9px}
  #goldChip{font-size:15px}
  #bpanel{top:auto;bottom:62px;left:8px;right:8px;width:auto;max-height:46vh}
  #missions{max-width:calc(100% - 16px);top:88px}
  #panel{max-height:56vh}
  #rot{top:96px;bottom:auto;right:8px;flex-direction:column}
  body.placing #side, body.panel-open #side{display:none}
}
.grid.field{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid.field .opt{padding:6px;min-width:0}
.grid.field .d{font-size:12px;line-height:1.25}
.grid.field .n{font-size:14px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="badges"></div>
<div id="pops"></div>
<div id="ui">
  <div id="top">
    <div class="chip" id="goldChip"><b id="gold">0</b><i class="gu">G</i></div>
    <div class="chip" id="clock">Day 1</div>
    <div class="chip" id="moodChip"><span id="moodLbl">幸福</span> <b id="mood">65</b></div>
    <button class="btn" id="nsBtn"></button>
    <button class="btn" id="spdBtn">▶ x1</button>
    <button class="btn" id="setBtn" data-act="panel:settings">⚙</button>
    <button class="btn" id="scoreBtn" data-act="score"></button>
    <button class="btn" id="shareBtn" data-act="share"></button>
    <span id="chips" style="display:contents"></span>
  </div>
  <div id="missions"></div>
  <div id="side">
    <div class="card px" id="tut" hidden><h4 id="tutH"></h4><div class="msg"></div><button class="btn skip" data-act="skipTut" id="tutSkip"></button></div>
    <div class="card px" id="goalCard"><h4 id="goalH"></h4><div id="goalTxt"></div><div class="bar"><i id="goalBar" style="width:0"></i></div></div>
  </div>
  <div id="bpanel" class="px scroll" hidden></div>
  <div id="panel" class="px scroll" hidden></div>
  <div id="confirm" class="px"><span id="confirmTxt"></span><button class="btn hot" id="confirmAuto" data-act="riverAuto" hidden></button><button class="btn hot" data-act="confirmYes">✓</button><button class="btn" data-act="confirmNo">✕</button></div>
  <div id="rot"><button class="btn" data-act="rotL">⟲</button><button class="btn" data-act="rotR">⟳</button></div>
  <div id="bottom">
    <button class="btn" data-act="panel:build" id="btnBuild"></button>
    <button class="btn" data-act="panel:upg" id="btnUpg"></button>
    <button class="btn" data-act="panel:market" id="btnMarket"></button>
    <button class="btn" data-act="panel:area" id="btnArea"></button>
  </div>
  <button class="btn hot" id="bellBtn" data-act="bell" hidden></button>
  <div id="visit" class="px" hidden></div>
  <div id="toasts"></div>
  <div id="tip" class="px"></div>
  <div id="modal" hidden><div class="mbox px scroll"></div></div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
