<style>
:root{
  --ink:#1b1f3a; --ink2:#2a3160; --paper:#f6ecc9; --hi:#ffd35a; --ok:#7ee08a; --ng:#ff6b6b; --sub:#a9b3e6;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030;color:var(--paper);
  font-family:'DotGothic16',monospace;font-size:15px;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated}
button{font:inherit;color:inherit;cursor:pointer}
.px{background:var(--ink);border:3px solid var(--paper);box-shadow:0 0 0 3px var(--ink),5px 5px 0 3px rgba(0,0,0,.45)}
.btn{white-space:nowrap;background:var(--ink2);border:2px solid var(--paper);padding:5px 10px;line-height:1.2;box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.btn:hover:not([disabled]){background:#3c4690}
.btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(0,0,0,.5)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{background:#5a3c10;border-color:var(--hi);color:var(--hi)}
.btn.hot{background:#2f6a3a}
#ui{position:fixed;inset:0;pointer-events:none}
#ui > *{pointer-events:auto}
#top{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#top > *{pointer-events:auto}
.chip{background:var(--ink);border:2px solid var(--paper);padding:3px 8px;box-shadow:3px 3px 0 rgba(0,0,0,.5);white-space:nowrap}
.chip b{color:var(--hi);font-weight:normal}
.chip.item{cursor:pointer}
.chip.item:hover{background:#3c4690}
.chip small{color:var(--sub)}
#goldChip{font-size:18px}
#side{position:absolute;right:8px;top:86px;width:250px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#side > *{pointer-events:auto}
.card{padding:8px 10px}
.card h4{margin:0 0 4px;font-weight:normal;color:var(--hi);font-size:14px}
.bar{height:8px;background:#0b0f26;border:1px solid var(--paper);margin-top:4px}
.bar i{display:block;height:100%;background:var(--hi)}
#tut{border-color:var(--hi)}
#tut .msg{line-height:1.5}
#tut .skip{margin-top:6px;font-size:12px;padding:2px 8px}
#bottom{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px}
#bottom .btn{font-size:16px;padding:8px 14px}
#panel{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));max-height:52vh;overflow:auto;padding:10px}
#bpanel{position:absolute;left:8px;top:86px;width:min(300px,calc(100vw - 32px));padding:10px;max-height:calc(100vh - 170px);overflow:auto}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;color:var(--hi)}
.ph .x{padding:0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.opt{text-align:left;padding:6px 8px;background:var(--ink2);border:2px solid var(--paper);box-shadow:3px 3px 0 rgba(0,0,0,.5)}
.opt:hover:not([disabled]){background:#3c4690}
.opt[disabled]{opacity:.45}
.opt .n{color:var(--hi)}
.opt .c{font-size:13px}
.opt .d{font-size:12px;color:var(--sub);line-height:1.35;margin-top:2px}
.row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed #4a5290}
.row .grow{flex:1}
.kv{font-size:13px;line-height:1.55}
.kv .g{color:var(--ok)} .kv .r{color:var(--ng)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#tip{position:absolute;padding:6px 8px;font-size:13px;line-height:1.45;pointer-events:none;max-width:260px;display:none}
#toasts{position:absolute;left:8px;bottom:62px;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:min(360px,calc(100vw - 32px))}
.toast{background:rgba(27,31,58,.92);border:2px solid var(--paper);padding:4px 8px;font-size:13px;animation:tin .15s steps(3)}
.toast.good{border-color:var(--ok)} .toast.bad{border-color:var(--ng)} .toast.ev{border-color:var(--hi)}
@keyframes tin{from{transform:translateX(-20px);opacity:0}}
#pops,#badges{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.badge{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:#1b1f3a;border:2px solid #f6ecc9;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;box-shadow:2px 2px 0 rgba(0,0,0,.45);font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif}
.badge.small{width:20px;height:20px;font-size:11px;opacity:.85}
.badge.warn{border-color:#ff6b6b;animation:bw .5s steps(2) infinite}
@keyframes bw{50%{border-color:#ffd35a}}
.pop{position:absolute;font-size:16px;color:#fff;text-shadow:2px 0 #000,-2px 0 #000,0 2px #000,0 -2px #000;white-space:nowrap;transform:translate(-50%,-50%)}
.pop.g{color:var(--hi);font-size:18px}
#modal{position:absolute;inset:0;background:rgba(5,8,25,.6);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .mbox{width:min(520px,100%);padding:14px 16px;max-height:90vh;overflow:auto}
#modal h2{margin:0 0 6px;font-weight:normal;color:var(--hi);font-size:20px}
#modal p{line-height:1.6;margin:6px 0}
#modal .opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
#modal .opt{width:100%}
#modal .day{font-size:12px;color:var(--sub)}
#modal .evimg{display:block;width:100%;max-height:36vh;object-fit:cover;border:2px solid var(--paper);margin:6px 0 8px;image-rendering:pixelated}
.title-big{font-size:28px;color:var(--hi);text-align:center;margin:8px 0}
.pulse{animation:pulse .6s steps(2) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--hi),3px 3px 0 rgba(0,0,0,.5)}}
[hidden]{display:none!important}
@media (max-width:700px){
  html,body{font-size:13px}
  #side{top:auto;bottom:62px;width:200px}
  #toasts{bottom:auto;top:96px}
  #bottom .btn{font-size:13px;padding:6px 8px}
  #goldChip{font-size:15px}
  #bpanel{top:96px}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>

<body>
<div id="ui">
  <div id="top">
    <div class="chip" id="goldChip">G <b id="gold">0</b></div>
    <span id="chips" style="display:contents"></span>
    <div class="chip" id="clock">Day 1 08:00</div>
    <div class="chip" id="moodChip" title="幸福度。高いほど住民の作業が速い">幸福 <b id="mood">65</b></div>
    <button class="btn" id="ugBtn" title="地下の様子を見る（採掘場の置き場所選びに）">地下を見る</button>
    <button class="btn" id="nsBtn" title="夜も働かせる（幸福度が下がる）">夜勤 OFF</button>
    <button class="btn" id="spdBtn" title="ゲーム速度">▶ x1</button>
    <button class="btn" id="sndBtn">音 ON</button>
  </div>
  <div id="side">
    <div class="card px" id="tut" hidden><h4>チュートリアル</h4><div class="msg"></div><button class="btn skip" data-act="skipTut">スキップ</button></div>
    <div class="card px" id="goalCard"><h4>目標：空港を開いて飛行船を呼ぶ</h4><div id="goalTxt"></div><div class="bar"><i id="goalBar" style="width:0"></i></div></div>
    <div id="contracts" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
  <div id="bpanel" class="px" hidden></div>
  <div id="panel" class="px" hidden></div>
  <div id="bottom">
    <button class="btn" data-act="panel:build" id="btnBuild">建設</button>
    <button class="btn" data-act="panel:upg" id="btnUpg">アップグレード</button>
    <button class="btn" data-act="panel:market" id="btnMarket">市場</button>
    <button class="btn" data-act="panel:area" id="btnArea">新エリア</button>
  </div>
  <div id="toasts"></div>
  <div id="badges"></div>
  <div id="pops"></div>
  <div id="tip" class="px"></div>
  <div id="modal" hidden><div class="mbox px"></div></div>
</div>
<script type="module">
import * as THREE from 'three';

/* =========================================================
   調整パラメーター（数値はここに集約）
   ========================================================= */
const P = {
  pixelScale: 3,        // 内部解像度 = 画面 / pixelScale
  dayLen: 100,          // 1日の秒数
  dayFrac: 0.72,        // 昼の割合（5時〜19時）
  startGold: 350,
  wage: 10,             // 1人あたり日給
  hireBase: 50, hireGrow: 1.16,
  walk: 1.7,            // マス/秒
  chopTime: 1.5, mineTime: 2.0,
  treeHP: 4, rockHP: 15,
  saplingTime: 45, regrowTick: 4, regrowP: 0.0035,
  satDrop: 0.02, satRecover: 0.008, satFloor: 0.3, autoSellRate: 2,
  goal: 12000,
  stoneBuy: 15,         // 石材の買値（売値6Gより高い）
  digTime: 1.8,         // 地下1マスを掘る秒数（土は半分）
  haulCap: 4,           // 運搬係が一度に運ぶ量
};
const ITEMS = {
  log:   {n:'丸太',       p:10,  c:0x9a6a3a},
  plank: {n:'板材',       p:35,  c:0xe0be80},
  furn:  {n:'高級家具',   p:150, c:0xb84a3a},
  stone: {n:'石材',       p:6,   c:0xa8aeb8},
  ore:   {n:'鉄鉱石',     p:50,  c:0x7a5a7e},
  ingot: {n:'鉄インゴット',p:200, c:0xd8e0ea},
  gear:  {n:'歯車・機械', p:800, c:0xe8b840},
};
const ITEM_KEYS = Object.keys(ITEMS);
const BUILD = {
  warehouse:{n:'倉庫（市場）', cost:{g:200}, hidden:true, light:true, d:'商品を貯めて売る場所。運搬係が働く'},
  camp:     {n:'木こり小屋', cost:{g:60},           job:'chop', range:2, d:'2マス以内の木を伐って小屋に丸太を貯める。森のそばほど効率がいい'},
  sawmill:  {n:'製材所',     cost:{g:150},          in:'log', out:'plank', time:3, ind:true, partner:'workshop', d:'丸太→板材。家具工房の隣で速度+30%'},
  workshop: {n:'家具工房',   cost:{g:700,stone:3},  in:'plank', out:'furn', time:6, ind:true, partner:'sawmill', d:'板材→高級家具。製材所の隣で速度+30%', light:true},
  house:    {n:'住宅',       cost:{g:120},          housing:3, light:true, near:true, d:'住める人数+3。2マス以内の施設の住民の移動+25%。ただし工場の隣はうるさい'},
  bakery:   {n:'パン屋',     cost:{g:450,stone:2},  mood:6, upkeep:20, light:true, near:true, d:'幸福+6（日20G）。2マス以内の施設の住民の移動+25%'},
  forester: {n:'植林小屋',   cost:{g:250},          plant:true, d:'2マス以内の空き地に苗木を植える'},
  mine:     {n:'採掘場',     cost:{g:500},          job:'dig', ind:true, d:'地下を掘って石材を貯める（鉄の鉱脈を掘ると決めたら鉄鉱石も）。上の「地下」で中が見える'},
  smelter:  {n:'製鉄所',     cost:{g:2500,stone:6}, in:'ore', out:'ingot', time:5, ind:true, partner:'factory', req:'mine', light:true, d:'鉄鉱石→鉄インゴット。機械工場の隣で+30%'},
  factory:  {n:'機械工場',   cost:{g:4500,stone:10},in:'ingot', out:'gear', time:8, ind:true, partner:'smelter', req:'mine', light:true, d:'インゴット→歯車・機械。製鉄所の隣で+30%'},
};
const UPGS = [
  {id:'drone',  n:'自動売却ドローン', cost:[400],               d:'市場で品目ごとに「自動売却」を設定できる'},
  {id:'axe',    n:'よく切れる斧',     cost:[200,1200,5000],     d:'クリック1回の収穫+1／住民の伐採・採掘+25%'},
  {id:'carry',  n:'丈夫な背負子',     cost:[300,1500,6000],     d:'住民が一度に運べる量+1'},
  {id:'road',   n:'石畳の道',         cost:[800,3000],          d:'よく通る道（土色のマス）が石畳になり、その上を歩く速度+25%（Lv2で+50%）'},
];
const W = 12, WH = 5 + 10*W; // 盤面は12×12。最初は中央の10×10だけが島。倉庫の位置 (5,10)
const DEBUG = /debug/.test(location.search);

/* ========================================================= 汎用 */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.random()*(b-a);
const fmt = n => { n = Math.floor(n); return Math.abs(n) >= 1e6 ? (n/1e6).toFixed(2)+'M' : n.toLocaleString('ja-JP'); };
const cx = i => i % W, cz = i => Math.floor(i / W);
const wpos = i => ({x: cx(i) - (W-1)/2, z: cz(i) - (W-1)/2});
const cellAt = (x, z) => clamp(Math.floor(z + W/2), 0, W-1)*W + clamp(Math.floor(x + W/2), 0, W-1);
const cheb = (a,b) => Math.max(Math.abs(cx(a)-cx(b)), Math.abs(cz(a)-cz(b)));
const neigh8 = i => { const r=[]; for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dz)continue; const x=cx(i)+dx,z=cz(i)+dz; if(x>=0&&x<W&&z>=0&&z<W) r.push(z*W+x);} return r; };

/* ========================================================= 状態 */
let S;
function newState(){
  const s = {
    v:3, festDay:0, gold:P.startGold, items:{}, sat:{}, auto:{}, seen:{log:true}, satCap:{},
    day:1, time:P.dayLen*P.dayFrac*3/14, mood:65,
    tut:0, flags:{drone:false, mine:false, sacred:false, steam:false, craft:false, forest:false, protectUntil:0, holidayDay:0, wageBonus:0},
    upg:{drone:0, axe:0, carry:0, road:0}, nightShift:false, nightUsed:false, nsStreak:0,
    contracts:[], loans:[], story:[], doneEvents:{}, lastEvent:'', airport:false, land:{x0:1,x1:10,z0:1,z1:10}, expand:0, wear:[],
    stats:{earned:0, sold:0, soldBy:{}, made:{}, treesCut:0, planted:0, nightShifts:0, festivals:0, holidays:0, contractsDone:0, contractsFail:0, loans:0, quits:0, moodSum:0, moodN:0, clicks:0},
    cells:[], sound:true, speed:1,
  };
  for (const k of ITEM_KEYS){ s.items[k]=0; s.sat[k]=1; s.auto[k]=false; s.stats.made[k]=0; s.stats.soldBy[k]=0; }
  // 島の生成：森のかたまり3つ＋岩
  for (let i=0;i<W*W;i++){ const x = cx(i), z = cz(i), inL = x>=1 && x<=10 && z>=1 && z<=10; s.cells.push(inL ? {t:'grass', r:Math.random()} : {t:'void'}); s.wear.push(0); }
  const centers = [[2.5,3],[8.5,2.5],[2.5,7.5],[9,7]].sort(()=>Math.random()-.5).slice(0,3);
  for (let i=0;i<W*W;i++){
    if (s.cells[i].t === 'void' || cheb(i,WH) <= 1) continue;
    let best = 99; for (const [x,z] of centers) best = Math.min(best, Math.hypot(cx(i)-x, cz(i)-z));
    if (best < 2.4 && Math.random() < 0.62) s.cells[i] = {t:'tree', hp:P.treeHP, r:Math.random()};
  }
  let rocks = 0, guard = 0;
  while (rocks < 8 && guard++ < 500){
    const i = Math.floor(Math.random()*W*W);
    if (s.cells[i].t !== 'grass' || cheb(i,WH) <= 2) continue;
    s.cells[i] = {t:'rock', hp:P.rockHP, r:Math.random()}; rocks++;
  }
  s.cells[WH] = {t:'b', r:.5, b:{type:'warehouse', lvl:1, workers:0, inb:0, st:{}, prog:0}};
  // 地下（3層×100マス）：0=掘った跡 1=土 2=石 3=鉄鉱石。深いほど鉄が多く、鉱脈のかたまりがある
  s.ug = [];
  const veins = [0,1,2,3].map(()=>[rnd(0,10), rnd(0,10)]);
  for (let L=0; L<3; L++) for (let i=0;i<W*W;i++){
    let dv = 99; for (const [x,z] of veins) dv = Math.min(dv, Math.hypot(cx(i)+0.5-x, cz(i)+0.5-z));
    const oreP = [0.06,0.16,0.3][L] + (dv < 1.7 ? [0.25,0.45,0.5][L] : 0), stoneP = [0.4,0.55,0.55][L];
    const r = Math.random(); s.ug.push(r < oreP ? 3 : r < oreP + stoneP ? 2 : 1);
  }
  return s;
}

/* ========================================================= レンダラ（3D→ドット絵） */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap; // ドットに合うカリッとした影
document.body.prepend(renderer.domElement);

let rt;
function makeRT(){
  if (rt) { rt.depthTexture.dispose(); rt.dispose(); }
  const sc = Math.min(innerWidth, innerHeight) < 600 ? 2 : P.pixelScale; // スマホは細かめのドットに
  const w = Math.max(64, Math.floor(innerWidth / sc)), h = Math.max(64, Math.floor(innerHeight / sc));
  const dt = new THREE.DepthTexture(w, h); dt.type = THREE.UnsignedIntType;
  rt = new THREE.WebGLRenderTarget(w, h, {minFilter:THREE.NearestFilter, magFilter:THREE.NearestFilter, depthTexture:dt, depthBuffer:true});
  postMat.uniforms.tColor.value = rt.texture;
  postMat.uniforms.tDepth.value = rt.depthTexture;
  postMat.uniforms.res.value.set(w, h);
}
// 星：実在の星座（オリオン座・北斗七星・カシオペヤ座・夏の大三角・さそり座・すばる・北極星）の並びを参考に、まばらに配置
// [方位(度), 高さ0〜1, 明るさ0〜1, 色 0=白 1=赤 2=青]
const STAR_DATA = [
  [172,.62,1,1],[186,.60,.75,0],[177,.50,.7,2],[180,.505,.72,2],[183,.51,.66,2],[174,.38,.68,0],[188,.37,1,2],[180,.70,.45,0],          // オリオン座
  [30,.78,.86,0],[31,.70,.76,0],[38,.69,.7,0],[39,.76,.58,0],[45,.78,.8,0],[50,.79,.76,0],[56,.75,.8,2],                             // 北斗七星
  [310,.80,.72,0],[315,.73,.76,0],[320,.79,.7,0],[325,.72,.64,0],[330,.80,.6,0],                                                      // カシオペヤ座
  [95,.86,1,2],[110,.80,.86,0],[101,.60,.9,0],                                                                                         // 夏の大三角
  [250,.45,1,1],[245,.55,.6,0],[247,.50,.55,0],[254,.40,.6,0],[257,.34,.55,0],[255,.28,.6,0],[250,.25,.5,0],                         // さそり座
  [204,.72,.42,2],[205.2,.735,.38,2],[206,.72,.42,2],[205,.705,.36,2],[204.4,.74,.32,2],                                               // すばる
  [0,.92,.72,0],                                                                                                                       // 北極星
  [140,.55,.4,0],[150,.82,.35,0],[160,.30,.38,0],[215,.45,.35,0],[230,.88,.3,0],[270,.70,.36,0],[285,.40,.4,0],[295,.60,.3,0],
  [345,.50,.38,0],[10,.40,.35,0],[65,.55,.38,0],[75,.88,.3,0],[125,.42,.34,0],[195,.92,.3,0],[355,.75,.32,0],[85,.30,.35,0],
];
const STARS = STAR_DATA.map(([az, alt, m, c]) => new THREE.Vector4(az*Math.PI/180, alt, m, c));
const postMat = new THREE.ShaderMaterial({
  uniforms:{ tColor:{value:null}, tDepth:{value:null}, res:{value:new THREE.Vector2()},
    skyTop:{value:new THREE.Color()}, skyBot:{value:new THREE.Color()}, night:{value:0}, time:{value:0}, edgeTh:{value:0.0016},
    stars:{value:STARS}, yaw:{value:0}, meteor:{value:new THREE.Vector4(0,0,0,2)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    uniform sampler2D tColor; uniform sampler2D tDepth; uniform vec2 res;
    uniform vec3 skyTop; uniform vec3 skyBot; uniform float night; uniform float time; uniform float edgeTh;
    #define NSTAR ${STARS.length}
    uniform vec4 stars[NSTAR]; uniform float yaw; uniform vec4 meteor;
    varying vec2 vUv;

/* ========================================================= ゲームロジック */
const workers = [];
const reserved = {};
const isB = (i, type) => S.cells[i].t === 'b' && (!type || S.cells[i].b.type === type);
const allB = type => { const r=[]; for (let i=0;i<W*W;i++) if (isB(i,type)) r.push(i); return r; };
const countB = type => allB(type).length;
const treeCount = () => S.cells.filter(c=>c.t==='tree').length;
const workerCount = () => workers.length;
const housing = () => 3 + allB('house').reduce((a,i)=>a + 3 + (S.cells[i].b.lvl-1)*2, 0);
const hourOf = t => { const d = P.dayLen*P.dayFrac; return t < d ? 5 + 14*t/d : 19 + 10*(t-d)/(P.dayLen-d); };
const isNight = () => { const h = hourOf(S.time); return h >= 19.25 || h < 5.5; };

const moodF = () => 0.5 + S.mood/100;
const carryCap = () => 2 + S.upg.carry;
const bufCap = b => 6 + 3*b.lvl;
const slots = b => b.type === 'warehouse' ? Math.min(6, b.lvl + 1) : (BUILD[b.type].job || BUILD[b.type].in) ? Math.min(6, b.lvl + 1) : 0;
// 建物の貯蔵（伐った丸太・掘った石・できた製品）
const stTotal = b => { let n = 0; for (const k in b.st || {}) n += b.st[k]; return n; };
const stCap = b => BUILD[b.type].in ? bufCap(b) : 10 + 5*b.lvl;
function stAdd(b, it, n){ b.st = b.st || {}; b.st[it] = (b.st[it] || 0) + n; }
function stMain(b){ let best = null, bn = 0; for (const k in b.st || {}) if (b.st[k] >= 1 && b.st[k] > bn){ bn = b.st[k]; best = k; } return best; }
const mineRange = b => b.lvl >= 3 ? 3 : 2;
const mineDepth = b => b.lvl >= 2 ? 3 : 2;
const festActive = () => S.festDay === S.day && hourOf(S.time) >= 17;
const holidayNow = () => S.flags.holidayDay === S.day && !isNight();
const hireCost = () => Math.round(P.hireBase * Math.pow(P.hireGrow, workerCount()));
function buildCost(type){
  const d = BUILD[type], n = countB(type);
  return {g: Math.round(d.cost.g * Math.pow(type==='house'?1.25:1.35, n)), stone: Math.round((d.cost.stone||0) * Math.pow(1.2, n))};
}
const lvlCost = b => Math.round(BUILD[b.type].cost.g * 1.5 * Math.pow(1.8, b.lvl-1));
function price(it){
  let m = S.sat[it]; const cap = S.satCap[it]; if (cap && S.day < cap.until) m = Math.min(m, cap.v);
  const craft = S.flags.craft && (it === 'furn' || it === 'gear') ? 1.3 : 1;
  return ITEMS[it].p * m * craft;
}
function partnerAdj(i){
  const d = BUILD[S.cells[i].b.type]; if (!d.partner) return false;
  return neigh8(i).some(j => isB(j, d.partner));
}
function nearBonus(i){ for (let j=0;j<W*W;j++) if (j!==i && S.cells[j].t==='b' && BUILD[S.cells[j].b.type]?.near && cheb(i,j) <= 2) return true; return false; }

  let n = 0; for (const h of [...allB('house'), ...allB('bakery')]) for (const j of neigh8(h)) if (S.cells[j].t==='b' && BUILD[S.cells[j].b.type]?.ind) n++;
  return n;
}
function speedMult(i){
  const b = S.cells[i].b; let m = Math.pow(1.4, b.lvl-1) * moodF();
  if (partnerAdj(i)) m *= 1.3;
  if (S.flags.steam) m *= 1.35;
  if (S.flags.forest) m *= 0.9;
  return m;
}
function moodBreakdown(){
  const L = [['基本', 50]];
  const t = treeCount(); L.push(['木の数('+t+'本)', Math.min(18, t*0.7) * (S.flags.forest?1.5:1)]);
  const bk = allB('bakery').reduce((a,i)=>a + 6 + (S.cells[i].b.lvl-1)*3, 0); if (bk) L.push(['パン屋', Math.min(30, bk)]);
  if (S.flags.sacred) L.push(['聖なる岩山', 8]);
  if (S.flags.craft) L.push(['職人の誇り', 4]);
  if (S.flags.steam) L.push(['工場の煙', -8]);
  const np = noisePairs(); if (np) L.push(['工場の騒音('+np+')', -3*np]);
  const hl = Math.max(0, workerCount() - housing()); if (hl) L.push(['家なし('+hl+'人)', -6*hl]);
  if (S.nightShift && isNight() && workerCount()) L.push(['夜勤中', -18]);

}
const moodTarget = () => clamp(moodBreakdown().reduce((a,[,v])=>a+v, 0), 0, 100);

/* ---- 売買 */
function sell(it, n, silent){
  n = Math.min(n, Math.floor(S.items[it])); if (n <= 0) return 0;
  let earn = 0;
  for (let k=0;k<n;k++){ earn += price(it); S.sat[it] = Math.max(P.satFloor, S.sat[it]*(1-P.satDrop)); }
  earn = Math.round(earn);
  S.items[it] -= n; S.gold += earn; S.stats.earned += earn; S.stats.sold += n; S.stats.soldBy[it] += n;
  if (!silent) { popAt(wpos(WH).x, 1.2, wpos(WH).z, '+'+fmt(earn)+'G', 'g'); coinBurst(Math.min(8, 1+Math.floor(earn/60))); sfx('coin'); }
  return earn;
}
// 石材が足りない分は市場から自動で買う（買値は売値より高い）
const stoneShort = c => Math.max(0, (c.stone||0) - Math.floor(S.items.stone));
const totalGold = c => c.g + stoneShort(c) * P.stoneBuy;
function pay(cost){
  if (!canPay(cost)) return false;
  const short = stoneShort(cost);
  if (short){ S.gold -= short * P.stoneBuy; S.items.stone += short; S.stats.stoneBought = (S.stats.stoneBought||0) + short; toast('石材が足りない分 '+short+'個を市場で購入（-'+fmt(short*P.stoneBuy)+'G）'); }
  S.gold -= cost.g; S.items.stone -= (cost.stone||0); return true;
}
function costTxt(c){ const sh = stoneShort(c); return fmt(c.g)+'G' + (c.stone ? ' + 石材'+c.stone : '') + (sh ? '<br><small style="color:var(--sub)">不足の石材'+sh+'個は購入 +'+fmt(sh*P.stoneBuy)+'G</small>' : ''); }
function canPay(c){ return S.gold >= totalGold(c); }
function buyStone(n){ const c = n * P.stoneBuy; if (S.gold < c) return; S.gold -= c; S.items.stone += n; S.seen.stone = true; S.stats.stoneBought = (S.stats.stoneBought||0) + n; sfx('coin'); }

/* ---- 建設 */
function canPlace(type, i){
  const c = S.cells[i];
  if (c.t === 'void') return '島の外（新エリアで島を広げられる）';
  if (c.t === 'b') return 'すでに建物がある';
  if (c.t === 'rock') return '岩がある（先に掘る）';
  if (BUILD[type].req === 'mine' && !S.flags.mine) return '未解放';
  if (!canPay(buildCost(type))) return 'お金が足りない（石材の不足分も含む）';
  return '';
}
function place(type, i){
  if (canPlace(type, i)) return false;
  const cost = buildCost(type); pay(cost);
  const c = S.cells[i];
  if (c.t === 'tree'){ const n = c.hp; S.items.log += n; S.stats.treesCut++; popAt(wpos(i).x, 0.8, wpos(i).z, '伐採 +'+n+' 丸太'); }
  if (reserved[i]) delete reserved[i];
  S.cells[i] = {t:'b', r:Math.random(), b:{type, lvl:1, workers:0, inb:0, st:{}, prog:0}};
  setCellMesh(i); CM[i].userData.pop = 0.35; sfx('build'); camS.shake = 0.06;
  burst(wpos(i).x, 0.3, wpos(i).z, 'stone', 6);
  assignLights(); return true;
}
function demolish(i){
  const b = S.cells[i].b; if (!b || b.type === 'warehouse') return;
  while (b.workers > 0) removeWorker(i, true);
  S.gold += Math.round(BUILD[b.type].cost.g * 0.4);
  if (BUILD[b.type].in) S.items[BUILD[b.type].in] += b.inb;
  for (const k in b.st || {}) S.items[k] += Math.floor(b.st[k]);
  S.cells[i] = {t:'grass', r:Math.random()}; setCellMesh(i); assignLights(); select(-1);
}
function hire(i){
  const b = S.cells[i].b;
  if (b.workers >= slots(b)) return toast('この施設はもう満員（レベルを上げると枠が増える）','bad');
  if (workerCount() >= housing()) return toast('住む家が足りない！住宅を建てよう','bad');
  const c = hireCost(); if (S.gold < c) return toast('お金が足りない','bad');
  S.gold -= c; addWorker(i); sfx('hire');
}
function levelUp(i){
  const b = S.cells[i].b; if (b.lvl >= 5) return;
  const c = lvlCost(b); if (S.gold < c) return;
  S.gold -= c; b.lvl++; CM[i].userData.pop = 0.35; sfx('build'); burst(wpos(i).x, 0.6, wpos(i).z, 'coin', 8);
}

/* ---- 住民
   木こり：範囲内の木を伐って小屋に貯める
   採掘：地下へ降りて掘り、採掘場に貯める
   加工：持ち場で機械を動かす（人数が多いほど速い）
   運搬係（倉庫）：建物の貯蔵を倉庫へ運び、加工所へ材料を届ける */
const ugRes = {}, haulRes = {};
function addWorker(bi){
  const b = S.cells[bi].b; b.workers++;
  const job = b.type === 'warehouse' ? 'haul' : (BUILD[b.type].job || 'proc');
  const p = wpos(WH);
  const w = {bi, job, x:p.x + rnd(-.2,.2), z:p.z - 0.5, tasks:[], carry:null, n:0, sleep:false, under:false, ug:-1, t:0, ox:rnd(-.22,.22), mesh:makeWorkerMesh(job), face:0, walk:0, work:false, dance:0};
  w.mesh.position.set(w.x, 0, w.z); scene.add(w.mesh); workers.push(w);
}
function release(w){ for (const m of [reserved, ugRes, haulRes]) for (const k in m) if (m[k] === w) delete m[k]; }
function removeWorker(bi){
  const idx = workers.map(w=>w.bi).lastIndexOf(bi); if (idx < 0) return;
  const w = workers[idx];
  if (w.carry) S.items[w.carry] += w.n;
  release(w); scene.remove(w.mesh); workers.splice(idx, 1); S.cells[bi].b.workers--;
}
const whPt = w => ({x: wpos(WH).x + w.ox, z: wpos(WH).z - 0.5});
const bPt = (i, w) => { const p = wpos(i); return {x:p.x + w.ox, z: Math.min(4.85, p.z + 0.42)}; };
const PLAZA = {x: wpos(WH).x, z: wpos(WH).z - 1.7};
function homeOf(w){
  let best = WH, bd = 99; for (const h of allB('house')){ const d = cheb(h, w.bi); if (d < bd){ bd = d; best = h; } }
  return best;
}
function findTree(bi, range){
  let best = -1, bd = 1e9;
  for (let i=0;i<W*W;i++){
    if (S.cells[i].t !== 'tree' || reserved[i] || cheb(i, bi) > range) continue;
    const d = Math.hypot(cx(i)-cx(bi), cz(i)-cz(bi)); if (d < bd){ bd = d; best = i; }
  }
  return best;
}
const ugMinable = v => S.ug[v] === 1 || S.ug[v] === 2 || (S.ug[v] === 3 && S.flags.mine);
function findVoxel(bi, b){
  let best = -1, bs = 1e9; const R = mineRange(b);
  for (let L=0; L<mineDepth(b); L++) for (let i=0;i<W*W;i++){
    if (cheb(i, bi) > R || S.cells[i].t === 'void') continue;
    const v = L*W*W + i;
    if (!ugMinable(v) || ugRes[v]) continue;
    if (L > 0 && S.ug[v - W*W] !== 0) continue;           // 上の層を掘ってから下へ
    const sc = L*4 + cheb(i, bi) + (S.ug[v] === 1 ? 0.5 : 0) - (S.ug[v] === 3 ? 1.5 : 0);
    if (sc < bs){ bs = sc; best = v; }
  }
  return best;
}
const upIf = w => w.under ? [{k:'up'}] : [];
function plan(w){
  const c = S.cells[w.bi]; if (!c || c.t !== 'b') return [{k:'wait', d:1}];
  const b = c.b;
  if (festActive()){ const a = Math.random()*Math.PI*2, r = 0.5 + Math.random()*0.4; return [...upIf(w), {k:'go', x:PLAZA.x + Math.cos(a)*r, z:PLAZA.z + Math.sin(a)*r}, {k:'dance', d:rnd(3,6)}]; }
  if (holidayNow()){ const land = S.cells.map((c,i)=>c.t==='void'?-1:i).filter(i=>i>=0), p = wpos(land[Math.floor(Math.random()*land.length)]); return [...upIf(w), {k:'go', x:p.x + rnd(-.3,.3), z:p.z + rnd(-.3,.3)}, {k:'dance', d:rnd(2,4), calm:true}]; }
  if (!workTime()){ const h = homeOf(w); const p = h === WH ? whPt(w) : bPt(h, w); return [...upIf(w), {k:'go', ...p}, {k:'sleep'}]; }
  if (b.broken) return [...upIf(w), {k:'go', ...bPt(w.bi,w)}, {k:'wait', d:2}];
  if (w.job === 'haul') return planHaul(w);
  if (w.job === 'chop'){
    if (S.day < S.flags.protectUntil) return [{k:'go', ...bPt(w.bi,w)}, {k:'wait', d:3}];
    if (stTotal(b) >= stCap(b)) return [{k:'go', ...bPt(w.bi,w)}, {k:'wait', d:1.5}];
    const tgt = findTree(w.bi, BUILD.camp.range);
    if (tgt < 0) return [{k:'go', ...bPt(w.bi,w)}, {k:'wait', d:2}];
    reserved[tgt] = w;
    const tp = wpos(tgt), dx = w.x - tp.x, dz = w.z - tp.z, L = Math.hypot(dx,dz) || 1;
    return [{k:'go', x:tp.x + dx/L*0.32, z:tp.z + dz/L*0.32}, {k:'work', cell:tgt}, {k:'go', ...bPt(w.bi,w)}, {k:'store'}];
  }
  if (w.job === 'dig'){
    if (stTotal(b) >= stCap(b)) return [...upIf(w), {k:'go', ...bPt(w.bi,w)}, {k:'wait', d:1.5}];
    const v = findVoxel(w.bi, b);
    if (v < 0) return [...upIf(w), {k:'go', ...bPt(w.bi,w)}, {k:'wait', d:3}];
    ugRes[v] = w;
    return [...(w.under ? [] : [{k:'go', ...bPt(w.bi,w)}, {k:'down'}]), {k:'dig', v}];
  }
  return [{k:'go', ...bPt(w.bi,w)}, {k:'op', d:2}];
}
function planHaul(w){
  const cap = P.haulCap + 2*S.upg.carry;
  let best = null, bs = 0;
  for (const i of allB()){
    if (i === WH || haulRes[i]) continue;
    const b = S.cells[i].b, d = BUILD[b.type], dist = 1 + Math.hypot(cx(i)-cx(WH), cz(i)-cz(WH));
    const tot = Math.floor(stTotal(b));
    if (tot >= 1){ const sc = (tot >= stCap(b) ? 3 : 1) * Math.min(tot, cap) / dist; if (sc > bs){ bs = sc; best = {i, kind:'pick'}; } }
    if (d.in && b.workers && !b.broken && S.items[d.in] >= 1 && b.inb < bufCap(b) - 1){ const sc = (b.inb < 2 ? 2.5 : 0.8) * Math.min(cap, bufCap(b) - b.inb) / dist; if (sc > bs){ bs = sc; best = {i, kind:'supply'}; } }
  }
  if (!best) return [{k:'go', ...whPt(w)}, {k:'wait', d:1}];
  haulRes[best.i] = w;
  const bp = bPt(best.i, w);
  if (best.kind === 'pick') return [{k:'go', ...bp}, {k:'take', i:best.i}, {k:'rel'}, {k:'go', ...whPt(w)}, {k:'dep'}];
  return [{k:'go', ...whPt(w)}, {k:'takeIn', i:best.i}, {k:'go', ...bp}, {k:'putIn', i:best.i}, {k:'take', i:best.i}, {k:'rel'}, {k:'go', ...whPt(w)}, {k:'dep'}];
}
function walkSpeed(w){ const paved = S.upg.road && S.wear[cellAt(w.x, w.z)] > 0.35; return P.walk * moodF() * (nearBonus(w.bi) ? 1.25 : 1) * (paved ? 1 + 0.25*S.upg.road : 1); }
const ugY = v => -0.3 - Math.floor(v / (W*W)) * 0.3;
function updateWorker(w, dt){
  w.work = false; w.dance = 0;
  if (w.sleep){ if (workTime() || festActive() || holidayNow()){ w.sleep = false; w.mesh.visible = true; w.tasks = []; } else return; }
  if (!w.tasks.length) w.tasks = plan(w);
  const t = w.tasks[0]; if (!t) return;
  const cb = S.cells[w.bi]; if (cb.t !== 'b'){ w.tasks = []; return; }
  const b = cb.b;
  switch (t.k){
    case 'go': {
      const dx = t.x - w.x, dz = t.z - w.z, L = Math.hypot(dx, dz), st = walkSpeed(w)*dt;
      if (L <= st){ w.x = t.x; w.z = t.z; w.tasks.shift(); }
      else { w.x += dx/L*st; w.z += dz/L*st; w.face = Math.atan2(dx, dz); w.walk += dt*14; const ci = cellAt(w.x, w.z); if (S.cells[ci].t === 'grass' || S.cells[ci].t === 'sapling') S.wear[ci] = Math.min(1, S.wear[ci] + dt*0.03); }
      break; }
    case 'wait': t.d -= dt; if (t.d <= 0) w.tasks.shift(); break;
    case 'op': t.d -= dt; w.work = true; w.t += dt; if (t.d <= 0) w.tasks.shift(); break;
    case 'dance': t.d -= dt; w.dance = t.calm ? 1 : 2; if (Math.random() < dt*0.25) popAt(w.x, 0.7, w.z, '♪'); if (t.d <= 0) w.tasks.shift(); break;
    case 'sleep': w.sleep = true; w.mesh.visible = false; w.tasks = []; break;
    case 'down': w.under = true; w.tasks.shift(); break;
    case 'up': { w.under = false; w.ug = -1; const p = bPt(w.bi, w); w.x = p.x; w.z = p.z; w.tasks.shift(); break; }
    case 'work': {
      const c = S.cells[t.cell];
      if (c.t !== 'tree' || S.day < S.flags.protectUntil){ delete reserved[t.cell]; if (w.n > 0) w.tasks.shift(); else w.tasks = []; break; }
      const tp = wpos(t.cell); w.face = Math.atan2(tp.x - w.x, tp.z - w.z); w.work = true;
      w.t += dt * moodF() * (1 + 0.25*S.upg.axe) * (1 + 0.2*(b.lvl-1));
      if (w.t >= P.chopTime){
        w.t = 0; w.carry = 'log'; w.n += c.gold ? 3 : 1; c.hp--;
        if (CM[t.cell]) CM[t.cell].userData.hit = 0.18;
        fellCheck(t.cell);
        if (w.n >= carryCap() || S.cells[t.cell].t !== 'tree'){ delete reserved[t.cell]; w.tasks.shift(); }
      }
      break; }
    case 'dig': {
      const v = t.v; w.ug = v;
      if (!ugMinable(v)){ delete ugRes[v]; w.tasks.shift(); break; }
      w.work = true;
      w.t += dt * moodF() * (1 + 0.25*S.upg.axe) * (1 + 0.2*(b.lvl-1));
      if (w.t >= (S.ug[v] === 1 ? P.digTime*0.5 : P.digTime)){
        w.t = 0; const kind = S.ug[v]; S.ug[v] = 0; ugDirty = true; delete ugRes[v];
        if (kind === 2){ stAdd(b, 'stone', 2); S.stats.made.stone += 2; S.seen.stone = true; }
        if (kind === 3){ stAdd(b, 'ore', 3); S.stats.made.ore += 3; S.seen.ore = true; }
        if (ugView){ const p = wpos(v % (W*W)); burst(p.x, ugY(v) - 0.1, p.z, kind === 3 ? 'ore' : kind === 2 ? 'stone' : 'dirt', 4); }
        else if (CM[w.bi]) CM[w.bi].userData.hit = 0.1;
        w.tasks.shift();
      }
      break; }
    case 'store':
      if (w.carry){ stAdd(b, w.carry, w.n); S.stats.made[w.carry] += w.n; }
      w.carry = null; w.n = 0; w.tasks.shift(); break;
    case 'take': {
      const c = S.cells[t.i]; if (c.t !== 'b'){ w.tasks.shift(); break; }
      const tb = c.b, it = stMain(tb);
      if (it){ const n = Math.min(Math.floor(tb.st[it]), P.haulCap + 2*S.upg.carry); tb.st[it] -= n; w.carry = it; w.n = n; }
      w.tasks.shift(); break; }
    case 'rel': release(w); w.tasks.shift(); break;
    case 'takeIn': {
      const c = S.cells[t.i]; if (c.t !== 'b'){ release(w); w.tasks = []; break; }
      const tb = c.b, d = BUILD[tb.type];
      const n = Math.min(Math.floor(S.items[d.in]), P.haulCap + 2*S.upg.carry, bufCap(tb) - tb.inb);
      if (n > 0){ S.items[d.in] -= n; w.carry = d.in; w.n = n; w.tasks.shift(); } else { release(w); w.tasks = []; }
      break; }
    case 'putIn': {
      const c = S.cells[t.i];
      if (c.t === 'b' && w.carry){ c.b.inb += w.n; w.carry = null; w.n = 0; }
      w.tasks.shift(); break; }
    case 'dep':
      if (w.carry){ S.items[w.carry] += w.n; S.seen[w.carry] = true; }
      w.carry = null; w.n = 0; w.tasks.shift(); break;
  }
}
function fellCheck(i){

    S.cells[i] = {t:'grass', r:Math.random()}; setCellMesh(i); S.stats.treesCut++;

}
function rockCheck(i){

  if (c.t === 'rock'){
    if (c.hp <= 0){ S.cells[i] = {t:'grass', r:Math.random()}; setCellMesh(i); burst(wpos(i).x, 0.3, wpos(i).z, 'stone', 8); toast('岩をひとつ掘り尽くした（地下は採掘場で掘れる）'); }

// 建物をクリック：貯まった物を回収し、加工所には倉庫から材料を補充する
function collect(i){
  const b = S.cells[i].b, d = BUILD[b.type], p = wpos(i), got = [];
  for (const k in b.st || {}){
    const n = Math.floor(b.st[k]); if (n < 1) continue;
    b.st[k] -= n; S.items[k] += n; S.seen[k] = true; got.push(ITEMS[k].n+' +'+n);
    burst(p.x, 0.6, p.z, k === 'log' ? 'log' : k === 'stone' ? 'stone' : 'item', Math.min(5, n), ITEMS[k].c);
  }

  return got.length > 0;

/* ---- クリック（手作業） */
function clickCell(i){
  const c = S.cells[i], p = wpos(i);
  if (c.t === 'tree'){
    const n = (1 + S.upg.axe) * (c.gold ? 3 : 1);
    S.items.log += n; c.hp--; S.stats.clicks++;
    CM[i].userData.hit = 0.2; camS.shake = 0.035; hitStop = 0.045;
    burst(p.x, 0.6, p.z, 'log', 1 + Math.min(3, n)); popAt(p.x, 1.1, p.z, '+'+n+' 丸太'); sfx('chop');

    fellCheck(i);

  }
  if (c.t === 'rock'){

    S.items.stone += n; S.seen.stone = true; c.hp--; S.stats.clicks++;
    CM[i].userData.hit = 0.2; camS.shake = 0.04; hitStop = 0.05;

/* ---- 1日の区切り */
function onDawn(){
  S.day++;
  if (S.nightUsed){ S.stats.nightShifts++; S.nsStreak++; } else S.nsStreak = 0;
  S.nightUsed = false;
  // 給料と維持費
  const wageEach = P.wage + S.flags.wageBonus;
  const wages = workerCount() * wageEach + allB('bakery').reduce((a,i)=>a + 20*S.cells[i].b.lvl, 0);
  if (wages > 0){
    if (S.gold >= wages){ S.gold -= wages; toast('Day '+S.day+' 朝：給料・維持費 -'+fmt(wages)+'G'); }
    else { S.gold = 0; addMood(-15); toast('給料が払えなかった…幸福 -15','bad'); }
  }
  // 返済
  for (const L of S.loans.slice()) if (S.day >= L.due){
    S.gold -= L.repay; S.loans.splice(S.loans.indexOf(L),1);
    toast('借金を返済 -'+fmt(L.repay)+'G' + (S.gold < 0 ? '（赤字！）' : ''), S.gold<0?'bad':'');
    if (S.gold < 0){ addMood(-10); story('返済で赤字に陥った'); }
  }
  // 契約の期限
  for (const C of S.contracts.slice()) if (S.day >= C.due){
    S.contracts.splice(S.contracts.indexOf(C),1);
    const back = Math.round(C.got * ITEMS[C.it].p);
    S.gold += back - C.penalty; addMood(-5); S.stats.contractsFail++;
    toast('契約失敗… 違約金 -'+fmt(C.penalty)+'G（納品分 +'+fmt(back)+'G）','bad'); story(ITEMS[C.it].n+'の大口契約を守れなかった');
  }
  // ストライキ
  if (S.mood < 20 && workerCount() > 0 && Math.random() < 0.6){
    const w = workers[Math.floor(Math.random()*workers.length)]; removeWorker(w.bi, true); S.stats.quits++;
    toast('不満が爆発！住民が1人島を去った','bad');
  }
  if (S.meteorNight === S.day - 1){
    addMood(12);
    const gift = Math.random() < 0.5 ? Math.round(rnd(200, 600)) : 0;
    if (gift){ S.gold += gift; toast('願いがかなった！流れ星のかけらが見つかった +'+fmt(gift)+'G','good'); } else toast('流れ星の夜を過ごして、みんなご機嫌だ（幸福 +12）','good');
  }

}

/* ---- 毎フレームの経済 */
let regrowAcc = 0, moodAcc = 0, sellAcc = 0, wearAcc = 0;
function sim(dt){
  S.time += dt;
  if (S.time >= P.dayLen){ S.time -= P.dayLen; onDawn(); }
  if (S.nightShift && isNight() && workerCount()) S.nightUsed = true;
  // 道のすり減りは少しずつ戻る
  wearAcc += dt; if (wearAcc >= 2){ wearAcc = 0; for (let i=0;i<W*W;i++) if (S.wear[i] > 0) S.wear[i] *= 0.996; }
  // 相場の回復
  for (const k of ITEM_KEYS) S.sat[k] += (1 - S.sat[k]) * (S.sat[k] < 1 ? P.satRecover : 0.004) * dt;
  // 自然再生・苗木
  regrowAcc += dt;
  const regMul = (S.flags.steam ? 0.5 : 1) * (S.flags.forest ? 2 : 1) * (S.day < S.flags.protectUntil ? 3 : 1) * (S.rainDay === S.day ? 3 : 1);
  for (let i=0;i<W*W;i++){
    const c = S.cells[i];
    if (c.t === 'sapling'){
      c.g += dt / P.saplingTime * (S.flags.forest ? 1.5 : 1);
      if (c.g >= 1){ S.cells[i] = {t:'tree', hp:P.treeHP, r:c.r}; setCellMesh(i); CM[i].userData.pop = 0.3; }
    }
  }
  if (regrowAcc >= P.regrowTick){
    regrowAcc -= P.regrowTick;
    for (let i=0;i<W*W;i++){
      if (S.cells[i].t !== 'grass' || i === WH) continue;
      const n = neigh8(i).filter(j=>S.cells[j].t==='tree').length;
      if (n && Math.random() < P.regrowP * n * regMul) sprout(i);
    }
  }
  // 施設
  const ops = {}; for (const w of workers) if (!w.sleep && w.job === 'proc' && !w.dance) ops[w.bi] = (ops[w.bi] || 0) + 1;
  const canWork = workTime() && !festActive();
  for (let i=0;i<W*W;i++){
    const c = S.cells[i]; if (c.t !== 'b') continue; const b = c.b, d = BUILD[b.type]; b._working = false;
    if (d.in){
      if (b.broken || !ops[i] || !canWork) continue;
      if (b.inb >= 1 && stTotal(b) < bufCap(b)){
        b._working = true; b.prog += dt * speedMult(i) * (1 + 0.5*(ops[i]-1));
        if (b.prog >= d.time){ b.prog -= d.time; b.inb--; stAdd(b, d.out, 1); S.stats.made[d.out]++; S.seen[d.out] = true; if (CM[i]) CM[i].userData.hit = 0.12; }
      }
    } else if (d.plant){
      b.prog += dt * Math.pow(1.4, b.lvl-1) * (S.flags.forest?1.5:1);
      if (b.prog >= 14){
        b.prog = 0;
        const cand = []; for (let j=0;j<W*W;j++) if (S.cells[j].t === 'grass' && j !== WH && cheb(i,j) <= 2) cand.push(j);
        if (cand.length){ const j = cand[Math.floor(Math.random()*cand.length)]; sprout(j); S.stats.planted++; }
      }
    } else if (d.job) b._working = b.workers > 0 && canWork;
  }
  for (const w of workers) updateWorker(w, dt);
  // 契約への自動納品（相場の影響を受けない）
  for (const C of S.contracts.slice()){
    const n = Math.min(Math.floor(S.items[C.it]), C.need - C.got);
    if (n > 0){ S.items[C.it] -= n; C.got += n; }
    if (C.got >= C.need){
      S.contracts.splice(S.contracts.indexOf(C),1); S.gold += C.reward; S.stats.earned += C.reward; S.stats.contractsDone++;
      toast('大口契約を達成！ +'+fmt(C.reward)+'G','good'); popAt(wpos(WH).x, 1.4, wpos(WH).z, '+'+fmt(C.reward)+'G','g'); coinBurst(10); sfx('fanfare');
      story(ITEMS[C.it].n+C.need+'個の大口契約をやり遂げた');
      eventQueue.push({result:true, img:'contract_ok', title:'大口契約、達成！', text:ITEMS[C.it].n+' '+C.need+'個を納めきった。商会から <b>'+fmt(C.reward)+'G</b> が支払われた。'});
    }
  }
  // 自動売却
  sellAcc += dt;
  if (S.upg.drone && sellAcc >= 1/P.autoSellRate){
    sellAcc = 0;
    for (const k of ITEM_KEYS) if (S.auto[k] && S.items[k] >= 1){ sell(k, 1, true); quietCoin(k); }

  if (moodAcc >= 0.5){
    const tgt = moodTarget(), d = tgt - S.mood; S.mood += Math.sign(d) * Math.min(Math.abs(d), 0.12*moodAcc);
    S.stats.moodSum += S.mood * moodAcc; S.stats.moodN += moodAcc; moodAcc = 0;
  }
  if (S.tut >= 0) tutCheck();
}

  const c = allB().filter(i=>S.cells[i].b.type !== 'warehouse' && S.cells[i].b.type !== 'house');
  if (c.length){ const i = c[Math.floor(Math.random()*c.length)]; S.cells[i].b.broken = true; CM[i].rotation.z = 0.12; }
  addMood(-8);
}
function queueEvent(){
  let ev = null;
  for (const e of EVENTS) if (e.fixed && !S.doneEvents[e.id] && !queuedIds[e.id] && S.day >= e.fixed){ ev = e; break; }
  if (!ev && Math.random() < 0.85){
    const pool = EVENTS.filter(e => !e.fixed && e.id !== S.lastEvent && (!e.cond || e.cond()));
    const tot = pool.reduce((a,e)=>a+e.w, 0); let r = Math.random()*tot;
    for (const e of pool){ r -= e.w; if (r <= 0){ ev = e; break; } }
  }
  if (!ev) return;
  S.lastEvent = ev.id; queuedIds[ev.id] = true;
  const E = ev.make(); E.id = ev.id; eventQueue.push(E);
}
const evImg = n => n ? '<img class="evimg" src="assets/ev/'+n+'.jpg" alt="">' : '';
function showEvent(E){
  const box = $('#modal .mbox');
  if (E.result){
    sfx('fanfare');
    box.innerHTML = evImg(E.img) + '<h2>'+E.title+'</h2><p>'+E.text+'</p><div class="opts"><button class="opt" data-act="closeModal"><div class="n">▶ つづける</div></button></div>';
    curEvent = null; $('#modal').hidden = false; return;
  }
  sfx('event');
  box.innerHTML = '<div class="day">Day '+S.day+' の朝</div>' + evImg(E.img) + '<h2>'+E.title+'</h2><p>'+E.text+'</p><div class="opts">' +
    E.opts.map((o,k)=>'<button class="opt" data-act="ev:'+k+'" '+(o.dis && o.dis() ? 'disabled':'')+'><div class="n">▶ '+o.l+'</div><div class="d">'+o.d+'</div></button>').join('') + '</div>';
  curEvent = E; $('#modal').hidden = false;
}
let curEvent = null;
function chooseEvent(k){
  const E = curEvent; if (!E) return; const o = E.opts[k]; if (o.dis && o.dis()) return;
  const res = o.f(); S.doneEvents[E.id] = true; curEvent = null; $('#modal').hidden = true; sfx('ui');
  if (res) eventQueue.unshift({result:true, ...res}); else toast('「'+o.l+'」を選んだ','ev');
}

function evaluate(){
  const st = S.stats, avg = st.moodN ? st.moodSum/st.moodN : S.mood;
  const ind = allB().filter(i=>BUILD[S.cells[i].b.type]?.ind).length;
  const ax = {
    nature:  Math.min(30, treeCount()*0.8) + Math.min(15, st.planted*0.15) + (S.flags.sacred?15:0) + (S.flags.forest?30:0),
    industry:Math.min(45, st.made.gear*0.5 + st.made.ingot*0.1) + (S.flags.steam?30:0) + ind*2,
    craft:   Math.min(40, st.made.furn*0.06) + (S.flags.craft?30:0),
    merchant:st.contractsDone*12 + st.loans*8 + Math.min(20, st.earned/5000),
    happy:   Math.max(0, avg-50)*1.5 + st.festivals*8 + st.holidays*8 + Math.min(10, (st.pets||0)*0.5),
    grind:   st.nightShifts*7 + (st.nightShifts ? Math.max(0, 45-avg)*0.6 : 0) + st.quits*6,
  };
  const T = {
    nature:['森と共に生きる島','木々のざわめきが聞こえる、緑の楽園になった。'],
    industry:['煙突と歯車の都','昼も夜も機械の音が響く、工業の都になった。'],
    craft:['名工の里','この島の家具は、本土でも名品として知られている。'],
    merchant:['商いの港町','約束と勝負で富を築いた、したたかな港町になった。'],
    happy:['笑顔あふれる村','忙しくても、みんなが笑っている村になった。'],
    grind:['眠らない島','明かりの消えない島。たくさん稼いだ……たぶん。'],

let AC = null; const sfxLast = {};
function sfx(type){

  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const now = AC.currentTime; if (sfxLast[type] && now - sfxLast[type] < 0.05) return; sfxLast[type] = now;
    const tone = (f, t0, dur, wave='square', vol=0.06, f2) => {
      const o = AC.createOscillator(), g = AC.createGain(); o.type = wave; o.frequency.setValueAtTime(f, now+t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, now+t0+dur);
      g.gain.setValueAtTime(vol, now+t0); g.gain.exponentialRampToValueAtTime(0.0001, now+t0+dur);
      o.connect(g).connect(AC.destination); o.start(now+t0); o.stop(now+t0+dur+0.02);
    };
    const noise = (t0, dur, vol=0.12, hp=800) => {
      const len = Math.floor(AC.sampleRate*dur), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);

      const s = AC.createBufferSource(), g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
      s.buffer = buf; g.gain.value = vol; s.connect(f).connect(g).connect(AC.destination); s.start(now+t0);
    };
    if (type==='chop'){ noise(0, 0.07, 0.25, 600); tone(220, 0, 0.08, 'square', 0.07, 90); }
    else if (type==='rock'){ noise(0, 0.06, 0.2, 1800); tone(140, 0, 0.07, 'square', 0.06, 70); }
    else if (type==='coin'){ tone(988, 0, 0.06, 'square', 0.05); tone(1319, 0.06, 0.16, 'square', 0.05); }
    else if (type==='coinS'){ tone(1319, 0, 0.05, 'square', 0.025); }
    else if (type==='build'){ noise(0, 0.15, 0.2, 200); tone(160, 0, 0.18, 'triangle', 0.15, 60); }

    else if (type==='pet'){ tone(1047, 0, 0.05, 'triangle', 0.06); tone(1568, 0.05, 0.08, 'triangle', 0.05); }

function updateDayNight(t){

const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0), _gp = new THREE.Vector3();
function pick(){
  mouse.set(mx/innerWidth*2-1, -(my/innerHeight)*2+1);
  raycaster.setFromCamera(mouse, cam);
  const hits = buildMode ? [] : raycaster.intersectObjects(pickables, true); // 建設中は地面のマスだけを見る
  for (const h of hits){
    let o = h.object; while (o && o.userData.cell === undefined) o = o.parent;
    if (o) return o.userData.cell;
  }
  // 地面は平面との交点でマスを求める（InstancedMeshのレイ判定より軽くて確実）
  if (raycaster.ray.intersectPlane(groundPlane, _gp)){
    const x = Math.floor(_gp.x + W/2), z = Math.floor(_gp.z + W/2);
    if (x >= 0 && x < W && z >= 0 && z < W && S.cells[z*W + x].t !== 'void') return z*W + x;

}

  if (S.tut >= 0 && TUT[S.tut]){
    let msg = TUT[S.tut].m;
    if (S.tut === 6 && countB('sawmill') && workerCount() >= housing()) msg = '住む家が満員で雇えない！<b>住宅</b>を建てるか、木こり小屋の住民を<b>減らそう</b>。';
    tutEl.hidden = false; tutEl.querySelector('.msg').innerHTML = '<small style="color:var(--sub)">'+(S.tut+1)+'/'+TUT.length+'</small><br>'+msg;
    const T = TUT[S.tut]; if (T.el){ const e = $(T.el); if (e) e.classList.add('pulse'); }
  } else tutEl.hidden = true;
}
function toast(msg, cls=''){
  const el = document.createElement('div'); el.className = 'toast '+cls; el.textContent = msg;
  const box = $('#toasts'); box.appendChild(el); while (box.children.length > 5) box.firstChild.remove();
  setTimeout(()=>el.remove(), 4500);
}

const marker = new THREE.Mesh(G.cone4, new THREE.MeshBasicMaterial({color:0xffd35a})); marker.scale.set(0.15,0.25,0.15); marker.rotation.x = Math.PI; scene.add(marker);
const hover = new THREE.Group();
for (let k=0;k<4;k++){ const m = new THREE.Mesh(G.box, new THREE.MeshBasicMaterial({color:0xffffff})); m.scale.set(k<2?1:0.06, 0.03, k<2?0.06:1); m.position.set(k<2?0:(k===2?-0.47:0.47), 0.02, k<2?(k===0?-0.47:0.47):0); hover.add(m); }
scene.add(hover);
function markerTarget(){
  const T = S.tut >= 0 ? TUT[S.tut] : null; if (!T || !T.mark) return -1;
  if (T.mark === 'tree'){ let best=-1, bd=99; for (let i=0;i<W*W;i++) if (S.cells[i].t==='tree'){ const d = cheb(i,WH); if (d<bd){bd=d;best=i;} } return best; }
  const l = allB(T.mark); return l.length ? l[0] : -1;

/* ---- 空港と飛行船（ゴール演出） */
let airship = null;
function buildAirport(docked){
  const L = S.land, px = L.x0 - (W-1)/2 - 1.9, pz = (L.z0 + L.z1)/2 - (W-1)/2;
  const g = new THREE.Group(); g.position.set(px, 0, pz);
  g.add(part(G.box, 0x9a9aa2, 2.4,0.16,2.4, 0,-0.08,0));
  for (const [x,z] of [[-1,-1],[1,-1],[-1,1],[1,1]]) g.add(part(G.cyl, 0x6a5a4a, 0.07,1.6,0.07, x,-0.9,z));
  g.add(part(G.box, 0x8a6a40, 1.0,0.1,0.4, 1.6,-0.05,0));                         // 島への桟橋
  for (let k=0;k<8;k++){ const a = k/8*Math.PI*2; g.add(part(G.box, 0xffd35a, 0.14,0.02,0.14, Math.cos(a)*0.8, 0.01, Math.sin(a)*0.8)); }
  g.add(part(G.cyl, 0xd8d8e0, 0.12,0.9,0.12, -0.8,0.45,-0.8)); const top = part(G.box, 0, 0.36,0.22,0.36, -0.8,1.0,-0.8, winMat); g.add(top);
  g.add(part(G.cone4, 0x4a6ab0, 0.3,0.2,0.3, -0.8,1.21,-0.8));
  g.add(part(G.cyl, 0xeeeeee, 0.03,1.6,0.03, 0.75,0.8,0.75)); { const sock = part(G.cone6, 0xff6a3a, 0.08,0.3,0.08, 0.92,1.4,0.75); sock.rotation.z = -Math.PI/2; g.add(sock); }
  scene.add(g);
  // 飛行船
  const a = new THREE.Group();
  const bal = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 2), MT(0xe8d8b0)); bal.scale.set(1.5,0.55,0.55); bal.castShadow = true; a.add(bal);
  for (const z of [-0.2, 0.2]) a.add(part(G.box, 0xc84a3a, 2.2,0.04,0.02, 0,0.1,z*2.6));
  const fin1 = part(G.box, 0xc84a3a, 0.4,0.5,0.04, 1.4,0,0); a.add(fin1); const fin2 = part(G.box, 0xc84a3a, 0.4,0.04,0.5, 1.4,0,0); a.add(fin2);
  a.add(part(G.box, 0x8a5a2e, 0.7,0.22,0.3, 0,-0.7,0)); a.add(part(G.box, 0, 0.5,0.08,0.31, 0,-0.66,0, winMat));
  const prop = part(G.box, 0x444444, 0.04,0.5,0.06, 0.42,-0.7,0); a.add(prop);
  scene.add(a);
  airship = {g:a, prop, pad:new THREE.Vector3(px, 1.5, pz), t: docked ? 1 : 0, ended: docked};
  if (docked) a.position.copy(airship.pad);
  else { sfx('fanfare'); camS.shake = 0.1; toast('空港が完成！飛行船がやってくる…','good'); }
}
function updateAirship(dt, t){
  if (!airship) return;
  const A = airship;
  if (A.t < 1){
    A.t = Math.min(1, A.t + dt/6);
    const k = 1 - Math.pow(1 - A.t, 3);
    A.g.position.set(A.pad.x - 22*(1-k), A.pad.y + 6*(1-k), A.pad.z + 8*(1-k));
    if (A.t >= 1 && !A.ended){ A.ended = true; burst(A.pad.x, 1, A.pad.z, 'coin', 16); showEnding(); }
  } else A.g.position.y = A.pad.y + Math.sin(t*1.2)*0.06;
  A.prop.rotation.x += dt*20;
}

/* ========================================================= 保存 */
const SAVE_KEY = 'dtt_save_v3';
let noSave = false;
function save(){ if (noSave) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch(e){} }
function load(){ try { const s = localStorage.getItem(SAVE_KEY); if (s){ const o = JSON.parse(s); if (o && o.v === 3) return o; } } catch(e){} return null; }
function initWorld(){
  for (let i=0;i<W*W;i++) setCellMesh(i);
  for (const w of workers.splice(0)) scene.remove(w.mesh);
  for (const m of [reserved, ugRes, haulRes]) for (const k in m) delete m[k];
  ugDirty = true;
  for (let i=0;i<W*W;i++) if (S.cells[i].t === 'b'){ const b = S.cells[i].b, n = b.workers; b.workers = 0; for (let k=0;k<n;k++) addWorker(i); if (b.broken) CM[i].rotation.z = 0.12; }
  updateTiles(); assignLights(); if (S.airport) buildAirport(true);
}
function resetGame(){ noSave = true; try { localStorage.removeItem(SAVE_KEY); } catch(e){} location.reload(); }
addEventListener('beforeunload', save);
setInterval(save, 10000);

/* ========================================================= メインループ */
let tileAcc = 0, last = performance.now(), uiAcc = 0, smokeAcc = 0, elapsed = 0, fwAcc = 0;
const bonfire = new THREE.Group();
for (let k=0;k<4;k++){ const l = part(G.cyl6, 0x7a4a2a, 0.04,0.32,0.04, 0,0.06,0); l.rotation.z = Math.PI/2; l.rotation.y = k*Math.PI/4; bonfire.add(l); }
bonfire.add(part(G.cone6, 0, 0.14,0.3,0.14, 0,0.22,0, fireMat)); bonfire.visible = false; scene.add(bonfire);
function frame(now){
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last)/1000); last = now; elapsed += dt;
  // ヒットストップ：伐った瞬間だけ世界の動きを止める
  let wdt = dt; if (hitStop > 0){ hitStop -= dt; wdt = 0; }
  if (!$('#modal').hidden) wdt = 0;
  else if (eventQueue.length && !curEvent && hitStop <= 0) showEvent(eventQueue.shift());
  const gdt = wdt * S.speed;
  if (gdt > 0){ const n = Math.ceil(gdt / 0.05); for (let k=0;k<n;k++) sim(gdt/n); }
  quietCoinT -= dt;
  // カメラ
  if (keys.ArrowLeft || keys.a || keys.A) camS.tyaw -= dt*1.8;
  if (keys.ArrowRight || keys.d || keys.D) camS.tyaw += dt*1.8;
  if (keys.ArrowUp || keys.w || keys.W) camS.tzoom = clamp(camS.tzoom*(1+dt), 0.6, 2.6);
  if (keys.ArrowDown || keys.s || keys.S) camS.tzoom = clamp(camS.tzoom*(1-dt), 0.6, 2.6);
  camS.yaw += (camS.tyaw - camS.yaw) * Math.min(1, dt*12);
  camS.zoom += (camS.tzoom - camS.zoom) * Math.min(1, dt*10);
  camS.shake = Math.max(0, camS.shake - dt*0.4); if (camS.shake < 0.004) camS.shake = 0;
  updateCam();
  updateDayNight(elapsed);
  if (ugView && ugDirty) updateUG();
  // オブジェクトのアニメ
  for (let i=0;i<W*W;i++){
    const g = CM[i]; if (!g) continue; const c = S.cells[i], u = g.userData;
    let s = 1;
    if (c.t === 'tree') s = u.base; else if (c.t === 'sapling') s = u.base * (0.25 + 0.6*c.g);
    else if (c.t === 'rock') s = 0.45 + 0.55*c.hp/P.rockHP;
    if (u.pop > 0){ u.pop -= dt; s *= 1 + Math.sin((0.35-u.pop)/0.35*Math.PI)*0.25; }
    if (u.hit > 0){
      u.hit -= dt; const k = u.hit/0.2;
      if (k > 0.75) g.scale.set(s*1.15, s*0.82, s*1.15); // 潰れ（スクワッシュ）
      else { g.scale.setScalar(s); g.rotation.z = Math.sin(u.hit*60)*0.18*k; }
    } else { g.scale.setScalar(s); if (!(c.t==='b' && c.b.broken)) g.rotation.z = 0; }
    if (c.t === 'b' && c.b.type !== 'warehouse'){
      const tot = stTotal(c.b), n = tot >= 1 ? Math.min(6, Math.ceil(tot / stCap(c.b) * 6)) : 0, it = stMain(c.b);
      if (n !== u.pileN || it !== u.pileIt){
        u.pileN = n; u.pileIt = it;
        if (!u.pile){ u.pile = new THREE.Group(); for (let k=0;k<6;k++){ const m = part(G.box, 0xffffff, 0.13,0.11,0.13, -0.38 + (k%2)*0.15, 0.055 + Math.floor(k/2)*0.11, 0.38); u.pile.add(m); } g.add(u.pile); }
        u.pile.children.forEach((m,k)=>{ m.visible = k < n; if (it) m.material = MT(ITEMS[it].c); });
      }
    }
    if (c.t === 'b'){
      if (c.b._working && wdt) for (const [m,ax,sp] of u.spin) m.rotation[ax] += sp*dt*S.speed;
      if (c.b._working && u.smoke && Math.random() < dt*2.2*Math.min(2,S.speed)){ const p = wpos(i); puff(p.x + u.smoke[0], u.smoke[1], p.z + u.smoke[2]); }
    }
  }
  for (const w of workers){
    const m = w.mesh, u = m.userData;
    if (w.under){ m.visible = ugView && !w.sleep && w.ug >= 0; if (!m.visible) continue; const p = wpos(w.ug % (W*W)); m.position.set(p.x + w.ox*0.6, ugY(w.ug) + 0.02, p.z + 0.25); u.body.rotation.x = Math.max(0, Math.sin(elapsed*9))*0.6; continue; }
    if (!w.sleep) m.visible = true;
    if (!m.visible) continue;
    m.position.set(w.x, w.dance === 2 ? Math.abs(Math.sin(elapsed*8 + w.ox*20))*0.12 : 0, w.z);
    if (w.dance === 2) w.face += dt*4;
    m.rotation.y += ((w.face - m.rotation.y + Math.PI*3) % (Math.PI*2) - Math.PI) * Math.min(1, dt*14);
    const moving = w.tasks[0]?.k === 'go';
    const bob = moving ? Math.abs(Math.sin(w.walk))*0.035 : 0;
    u.body.position.y = 0.13 + bob; u.head.position.y = 0.27 + bob; u.hat.position.y = 0.35 + bob; u.carry.position.y = 0.43 + bob;
    u.legL.position.z = moving ? Math.sin(w.walk)*0.035 : 0; u.legR.position.z = -u.legL.position.z;
    u.body.rotation.x = w.work ? Math.max(0, Math.sin(w.t*9))*0.6 : 0;
    u.carry.visible = !!w.carry; if (w.carry) u.carry.material = MT(ITEMS[w.carry].c);
  }
  // 雲クジラは昼のあいだ島のまわりを一周する
  if (S.whaleDay === S.day && !isNight()){
    whale.visible = !ugView; const k = (hourOf(S.time) - 5) / 14, a = k*Math.PI*2 + 0.8;
    whale.position.set(Math.cos(a)*9.5, 3.2 + Math.sin(elapsed*0.6)*0.25, Math.sin(a)*9.5); whale.rotation.y = -a - Math.PI/2;
    whale.userData.tail.rotation.z = Math.sin(elapsed*1.5)*0.25;
  } else whale.visible = false;
  // 恵みの雨
  const raining = S.rainDay === S.day && !isNight() && !ugView;
  for (const m of rain){ if (!raining){ m.visible = false; continue; } if (!m.visible || m.position.y < 0){ m.visible = true; m.position.set(rnd(-6,6), rnd(3,7), rnd(-6,6)); } m.position.y -= dt*9; }
  // 浮遊石：ひびが入っているとまたたく
  leviStone.rotation.y += dt*0.3; leviStone.position.y = -6.6 + Math.sin(elapsed*0.8)*0.1;
  leviStone.material.emissiveIntensity = S.flags.crack ? 0.3 + Math.abs(Math.sin(elapsed*7))*0.5 : 0.8 + Math.sin(elapsed*1.5)*0.15;
  const fest = festActive();
  if (fest){
    festLight.position.set(PLAZA.x, 0.5, PLAZA.z); festLight.intensity = 2.6 + Math.sin(elapsed*13)*0.5;
    if (!bonfire.visible){ bonfire.visible = true; bonfire.position.set(PLAZA.x, 0, PLAZA.z); }
    if (nightAmt > 0.3 && wdt){ fwAcc += dt; if (fwAcc > 0.8){ fwAcc = 0; firework(); } }
  } else if (bonfire.visible){ bonfire.visible = false; festLight.intensity = 0; }
  for (const c of clouds){ const a = Math.atan2(c.position.z, c.position.x) + c.userData.v*dt*0.05, r = Math.hypot(c.position.x, c.position.z); c.position.x = Math.cos(a)*r; c.position.z = Math.sin(a)*r; }
  for (const f of floaters) f.position.y += Math.sin(elapsed*0.8 + f.userData.float)*0.002;
  updateFx(wdt ? dt : 0); updatePops(dt); updateBadges(); updateAirship(dt, elapsed); updateCritters(wdt ? dt : 0);
  // マーカー・ホバー
  const mt = markerTarget();
  if (mt >= 0){ const p = wpos(mt); marker.visible = true; marker.position.set(p.x, 1.35 + Math.abs(Math.sin(elapsed*5))*0.2, p.z); } else marker.visible = false;
  hoverCell = (mouseIn && !drag) ? pick() : -1;
  if (hoverCell >= 0){ const p = wpos(hoverCell); hover.visible = true; hover.position.set(p.x, 0, p.z); } else hover.visible = false;
  if (buildMode && ghost){
    const tip = $('#tip');
    if (hoverCell >= 0){
      const p = wpos(hoverCell), ok = !canPlace(buildMode, hoverCell);
      ghost.visible = true; ghost.position.set(p.x, 0.02, p.z);
      ghost.traverse(o=>{ if (o.isMesh) o.material = ok ? ghostOk : ghostNg; });
      tip.style.display = 'block'; tip.innerHTML = placementInfo(buildMode, hoverCell);
      tip.style.left = Math.min(innerWidth - 270, mx + 16) + 'px'; tip.style.top = Math.min(innerHeight - 140, my + 12) + 'px';
    } else { ghost.visible = false; tip.style.display = 'none'; }
  }
  tileAcc += dt; if (tileAcc > 1){ tileAcc = 0; updateTiles(); }
  uiAcc += dt;
  if (uiAcc > 0.2){ uiAcc = 0; renderTop(); renderPanel(); renderBPanel(); }
  // 描画：低解像度ターゲット → ドット拡大
  renderer.setRenderTarget(rt); renderer.render(scene, cam);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); makeRT(); });

/* ========================================================= 起動 */
S = load() || newState();
for (const k of ITEM_KEYS){ S.items[k] ??= 0; S.sat[k] ??= 1; S.stats.made[k] ??= 0; S.stats.soldBy[k] ??= 0; }

if (S.tut < 0) for (const e of EVENTS) if (e.fixed && !S.doneEvents[e.id] && S.day >= e.fixed){ queuedIds[e.id] = true; const E = e.make(); E.id = e.id; eventQueue.push(E); }
// タイトル画面（クリックで即開始＝音もここで有効になる）
{
  const fresh = S.tut === 0 && S.stats.clicks === 0;
  $('#modal .mbox').innerHTML = '<img src="assets/logo.png" alt="ジオラマ・タウン・タイクーン" style="display:block;width:min(300px,70vw);margin:0 auto;image-rendering:auto">' +
    '<p style="text-align:center">中身は3D、見た目はドット絵。<br>浮島の街を、あなたのやり方で育てよう。</p>' +
    '<div class="opts"><button class="opt" data-act="closeModal"><div class="n">▶ '+(fresh?'はじめる':'つづきから（Day '+S.day+'）')+'</div><div class="d">ドラッグ：回転　ホイール：ズーム　クリック：伐採・建物を選ぶ</div></button>' +
    (fresh ? '' : '<button class="opt" data-act="confirmReset"><div class="n">▶ 新しい島ではじめる</div></button>') + '</div>';
  $('#modal').hidden = false;
}
requestAnimationFrame(frame);

// テスト・デバッグ用の窓口
window.DTT = {WH, W, expandIsland, setUGView, critters, EVENTS, get S(){return S;}, P, place, hire, levelUp, sell, clickCell, chooseEvent, get curEvent(){return curEvent;}, workers, allB, evaluate, treeCount, startBuild, sim, onDawn, buyUpg:(id)=>{const u=UPGS.find(u=>u.id===id),c=u.cost[S.upg[id]]; if(c!==undefined&&S.gold>=c){S.gold-=c;S.upg[id]++;return true;} return false;}, skipTut:()=>{S.tut=-1;$('#tut').hidden=true;}, eventQueue, reset:resetGame, bench:(n=30)=>{const px=new Uint8Array(4);const gl=renderer.getContext();const t0=performance.now();for(let k=0;k<n;k++){renderer.setRenderTarget(rt);renderer.render(scene,cam);renderer.setRenderTarget(null);renderer.render(postScene,postCam);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);}return (performance.now()-t0)/n;}, setScale:(v)=>{P.pixelScale=v;makeRT();}, get dbg(){return {buildMode,hoverCell,mouseIn,drag,selCell};}, rayDbg:(x,y)=>{mouse.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);raycaster.setFromCamera(mouse,cam);const t=raycaster.intersectObject(tileMesh,false);return {n:t.length,id:t[0]?.instanceId,bs:tileMesh.boundingSphere,pk:pickables.length,all:raycaster.intersectObjects(pickables,true).length};}, screenOf:(i)=>{const p=wpos(i);const v=new THREE.Vector3(p.x,0,p.z).project(cam);return [(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight];}};
</script>
